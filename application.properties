server.port=8083
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agricred}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agricred}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-this-local-password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
